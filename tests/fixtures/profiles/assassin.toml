# Thief with claws (example: set the skill keys to your in-game bindings)
description = "Assassin: throws from mid range and uses Flash Jump to cover distance"
behaviour = "ranged"
gone_delay = 0.5        # After a hit lands, seconds to watch before attacking again if the mob is still there

[keys]
jump = "Alt"
loot = "Z"

[ranged]
keep_distance = 55

[[attacks]]
name = "Lucky Seven"
key = "Ctrl"
hit_time = 0.35          # Seconds from the key press until the hit shows on the mob
range_x = [55, 305]
range_y = [-40, 40]

[[mobility]]
type = "flash_jump"      # Jump, then jump again mid-air; uses the jump key
min_distance = 250
