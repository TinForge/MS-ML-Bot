[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-ml-bot"
version = "1.0"
description = "Maplestory Machine Learning Bot"
requires-python = ">=3.13"

# Dependencies are pinned in requirements.txt (torch needs the CUDA index)

[tool.setuptools.packages.find]
include = ["data*", "gui*", "process*", "tools*", "yolov5*"]
